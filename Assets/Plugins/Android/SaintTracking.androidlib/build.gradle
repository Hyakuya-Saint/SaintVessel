// Android library that Unity compiles into the APK.
// Hosts the CameraX + MediaPipe Tasks (pose + face) tracking bridge.
apply plugin: 'com.android.library'

android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']   // *.task models are downloaded here (scripts/fetch-models.sh)
        }
    }

    aaptOptions { noCompress 'task', 'tflite' }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.2'
}
