name: Build Saint Vessel (Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the GitHub Release

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unity Android build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (the Unity Android image is large)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Download MediaPipe models
        run: bash scripts/fetch-models.sh

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: SaintVessel.Editor.BuildScript.BuildAndroid
          androidExportType: androidPackage
          allowDirtyBuild: true
          versioning: None

      - name: Check output
        run: ls -lh build/Android

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaintVessel-apk
          path: build/Android/SaintVessel.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Saint Vessel build ${{ github.run_number }}
          body: |
            Automated build of commit ${{ github.sha }}.
            Install `SaintVessel.apk` on an Android 8.0+ (arm64) device and allow the camera.
          files: build/Android/SaintVessel.apk
