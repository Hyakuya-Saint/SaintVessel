// Godot 4 Android plugin (v2): CameraX -> MediaPipe pose + face landmarkers -> float[] packet polled from GDScript.
// Built to an AAR by tools/build-plugin.sh. Runtime dependencies are declared in android/plugins/SaintTracking.gdap
// (so they are not bundled here); the MediaPipe .task models are bundled as AAR assets (src/main/assets).
plugins {
    id 'com.android.library' version '8.2.2'
}

android {
    namespace 'com.saintvessel.tracking'
    compileSdk 34

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress 'task', 'tflite'
    }
}

dependencies {
    compileOnly 'org.godotengine:godot:4.3.0.stable'
    compileOnly 'com.google.mediapipe:tasks-vision:0.10.14'
    compileOnly 'androidx.camera:camera-core:1.3.4'
    compileOnly 'androidx.camera:camera-camera2:1.3.4'
    compileOnly 'androidx.camera:camera-lifecycle:1.3.4'
    compileOnly 'androidx.core:core:1.12.0'
    compileOnly 'androidx.lifecycle:lifecycle-runtime:2.6.2'
}
